<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>G1Sword2H14z</title>
  
  <style>
    body {
      background-color: #f0f8ff; 
      text-align: center;        
      font-family: "Microsoft YaHei", sans-serif; 
      margin-top: 60px;         
    }
    h1 {
      color: #333333;            
    }
    p {
      color: #0066cc;            
      font-size: 20px;           
    }
    
    /* 这是给图片设置的样式 */
    .my-image {
      width: 300px;              /* 图片宽度 */
      border-radius: 15px;       /* 图片圆角 */
      box-shadow: 5px 5px 15px gray; /* 加点阴影更好看 */
      margin: 20px 0;            /* 上下留点空隙 */
    }

    /* 这是给按钮设置的样式 */
    .my-button {
      display: inline-block;
      padding: 12px 24px;        /* 按钮内边距 */
      background-color: #0066cc; /* 按钮背景色 */
      color: white;              /* 按钮文字颜色 */
      text-decoration: none;     /* 去掉链接的下划线 */
      border-radius: 8px;        /* 按钮圆角 */
      font-size: 18px;
    }
    
    /* 鼠标悬停时按钮变深色 */
    .my-button:hover {
      background-color: #004499;
    }
  </style>
</head>
<body>
  <h1>主人是gmh</h1>
  <p>嘿嘿。</p>

  <!-- 这是一个图片标签 -->
  <img class="my-image" src="https://picsum.photos/400/250" alt="一张随机的风景图">
  
  <br><br> <!-- 换行标签，用来隔开图片和按钮 -->

  <!-- 这是一个链接，因为加了样式，所以看起来像个按钮 -->
  <a href="https://ys.mihoyo.com/cloud/#/" target="_blank" class="my-button">点我去看世界</a>

</body>
</html>
